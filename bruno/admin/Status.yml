info:
  name: Status
  type: http
  seq: 2

http:
  method: GET
  url: "{{admin_url}}/api/status"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: What the process has received since it started. Never includes a PASSKEY.
