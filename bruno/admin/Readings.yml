info:
  name: Readings
  type: http
  seq: 3

http:
  method: GET
  url: "{{admin_url}}/api/readings"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.stations
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Each station's latest report, in the operator's units, with its warnings.
