info:
  name: OpenAPI document
  type: http
  seq: 2

http:
  method: GET
  url: "{{dashboard_url}}/api/v1/openapi.json"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.paths
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
