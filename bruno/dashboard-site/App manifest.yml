info:
  name: App manifest
  type: http
  seq: 4

http:
  method: GET
  url: "{{dashboard_url}}/manifest.webmanifest"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.display
      operator: eq
      value: standalone

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
