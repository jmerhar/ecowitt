info:
  name: API docs page
  type: http
  seq: 3

http:
  method: GET
  url: "{{dashboard_url}}/api/v1/docs"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: text/html

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
