opencollection: 1.0.0

info:
  name: Ecowitt Server
  version: "1"

docs:
  content: |-
    Every read endpoint of Ecowitt Server: the public dashboard's API and the collector's admin
    listener. Choose an environment: `local` is the project's default ports, `example` a template
    for a deployment. Keep your own deployment's environment beside them: environments/ ignores
    everything but these two.

    Left out on purpose: the station's ingest endpoint, which writes readings, and the admin
    listener's forms, which need the page's CSRF token.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
