info:
  name: Extremes - this month
  type: http
  seq: 13

http:
  method: GET
  url: "{{dashboard_url}}/api/v1/stations/{{station}}/extremes?period=month&lang={{lang}}"
  params:
    - name: period
      value: month
      type: query
    - name: lang
      value: "{{lang}}"
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.period
      operator: eq
      value: month

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
