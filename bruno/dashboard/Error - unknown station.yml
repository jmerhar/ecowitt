info:
  name: Error - unknown station
  type: http
  seq: 15

http:
  method: GET
  url: "{{dashboard_url}}/api/v1/stations/no-such-station/now"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
