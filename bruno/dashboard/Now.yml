info:
  name: Now
  type: http
  seq: 3

http:
  method: GET
  url: "{{dashboard_url}}/api/v1/stations/{{station}}/now?lang={{lang}}"
  params:
    - name: temperature
      value: f
      type: query
      disabled: true
    - name: pressure
      value: inhg
      type: query
      disabled: true
    - name: rain
      value: in
      type: query
      disabled: true
    - name: wind
      value: mph
      type: query
      disabled: true
    - name: distance
      value: mi
      type: query
      disabled: true
    - name: lang
      value: "{{lang}}"
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.summary
      operator: isString
    - expression: res.body.timezone
      operator: isString
    - expression: res.body.airing.advice
      operator: isString
    - expression: res.body.airing.humidity
      operator: isNumber
    - expression: res.body.airing.windows_open
      operator: isBoolean

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
