info:
  name: Meta
  type: http
  seq: 1

http:
  method: GET
  url: "{{dashboard_url}}/api/v1/meta?lang={{lang}}"
  params:
    - name: lang
      value: "{{lang}}"
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.metrics
      operator: isArray
    - expression: res.body.ranges
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
