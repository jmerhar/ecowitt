info:
  name: Stations
  type: http
  seq: 2

http:
  method: GET
  url: "{{dashboard_url}}/api/v1/stations?lang={{lang}}"
  params:
    - name: lang
      value: "{{lang}}"
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray
    - expression: res.body[0].id
      operator: isString
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body[0].id
        method: jsonq
      variable:
        name: station
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
