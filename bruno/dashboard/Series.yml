info:
  name: Series
  type: http
  seq: 7

http:
  method: GET
  url: "{{dashboard_url}}/api/v1/stations/{{station}}/series?metrics=outdoor.temperature,outdoor.dew_point&range=24h&model=false&lang={{lang}}"
  params:
    - name: metrics
      value: outdoor.temperature,outdoor.dew_point
      type: query
    - name: range
      value: 24h
      type: query
    - name: model
      value: "false"
      type: query
    - name: temperature
      value: f
      type: query
      disabled: true
    - name: pressure
      value: inhg
      type: query
      disabled: true
    - name: rain
      value: in
      type: query
      disabled: true
    - name: wind
      value: mph
      type: query
      disabled: true
    - name: distance
      value: mi
      type: query
      disabled: true
    - name: lang
      value: "{{lang}}"
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.series
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "metrics: one or more ids from Meta, comma-separated. range: 1h 3h 6h 12h 24h 7d 30d 1y. model=true adds the weather model's series where it has the metric."
