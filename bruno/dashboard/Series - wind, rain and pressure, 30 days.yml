info:
  name: Series - wind, rain and pressure, 30 days
  type: http
  seq: 9

http:
  method: GET
  url: "{{dashboard_url}}/api/v1/stations/{{station}}/series?metrics=wind.speed,wind.gust,wind.direction,rain.daily,pressure.sea_level&range=30d&lang={{lang}}"
  params:
    - name: metrics
      value: wind.speed,wind.gust,wind.direction,rain.daily,pressure.sea_level
      type: query
    - name: range
      value: 30d
      type: query
    - name: lang
      value: "{{lang}}"
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.series
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
