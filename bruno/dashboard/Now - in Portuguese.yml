info:
  name: Now - in Portuguese
  type: http
  seq: 5

http:
  method: GET
  url: "{{dashboard_url}}/api/v1/stations/{{station}}/now?lang=pt-PT"
  params:
    - name: lang
      value: pt-PT
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.summary
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: The same answer with its words in European Portuguese.
