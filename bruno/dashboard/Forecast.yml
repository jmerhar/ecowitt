info:
  name: Forecast
  type: http
  seq: 11

http:
  method: GET
  url: "{{dashboard_url}}/api/v1/stations/{{station}}/forecast?lang={{lang}}"
  params:
    - name: temperature
      value: f
      type: query
      disabled: true
    - name: pressure
      value: inhg
      type: query
      disabled: true
    - name: rain
      value: in
      type: query
      disabled: true
    - name: wind
      value: mph
      type: query
      disabled: true
    - name: distance
      value: mi
      type: query
      disabled: true
    - name: lang
      value: "{{lang}}"
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.hours
      operator: isArray
    - expression: res.body.days
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: No hours or days for a station that does not store its weather model's forecast.
