info:
  name: Series - rooms and sun, a year
  type: http
  seq: 10

http:
  method: GET
  url: "{{dashboard_url}}/api/v1/stations/{{station}}/series?metrics=rooms.temperature,rooms.humidity,solar.radiation,solar.uv_index&range=1y&lang={{lang}}"
  params:
    - name: metrics
      value: rooms.temperature,rooms.humidity,solar.radiation,solar.uv_index
      type: query
    - name: range
      value: 1y
      type: query
    - name: lang
      value: "{{lang}}"
      type: query

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.series
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
