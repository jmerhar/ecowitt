[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecowitt-collector"
version = "0.1.0"
description = "Ecowitt Server's collector: receive an Ecowitt station's reports and store them"
requires-python = ">=3.14"
dependencies = [
    "ecowitt-core",
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx2>=2.13",
    "pyyaml>=6.0",
    # Templates for the status and setup pages; escapes HTML by default, which matters because
    # station names and console metadata end up on them.
    "jinja2>=3.1",
    # Offline time zone of a pair of coordinates, for the station metadata the dashboard reads.
    "tzfpy>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/jmerhar/ecowitt"

[tool.hatch.build.targets.wheel]
# ecowitt is a namespace shared with ecowitt-core and ecowitt-dashboard: this project ships only
# ecowitt/collector, and no project may add an ecowitt/__init__.py.
packages = ["src/ecowitt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
# Each project's tests run on their own; importlib mode keeps same-named test modules in
# different projects from colliding.
addopts = ["--import-mode=importlib"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["ecowitt.collector"]
# The listeners and the spool flusher are async, and coverage's sys.monitoring core
# (COVERAGE_CORE=sysmon, set in bin/test-python.sh and CI) traces lines after `await`, which
# the legacy C core under-reports. On 3.14 sysmon is the default and supports branch
# coverage, so branches are safe to enable.
branch = true
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
# `exclude_also` augments coverage's default pragma list rather than replacing it, so
# `# pragma: no cover` still works alongside these structural exclusions.
exclude_also = [
    "if TYPE_CHECKING:",
    # A module entrypoint: unreachable by definition once the module is imported.
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
