[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecowitt"
version = "0.1.0"
description = "Ecowitt Server: store the metrics an Ecowitt weather station reports in InfluxDB"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx2>=2.13",
    "pyyaml>=6.0",
    # Templates for the status and setup pages; escapes HTML by default, which matters because
    # station names and console metadata end up on them.
    "jinja2>=3.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/jmerhar/ecowitt"

[tool.hatch.build.targets.wheel]
packages = ["src/ecowitt"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# On top of the defaults (pyflakes and pycodestyle errors): unused arguments and imports,
# comprehension and builtin misuse, and the bug-prone patterns in flake8-bugbear -- mutable
# default arguments and `except` clauses that swallow everything among them.
select = ["E", "F", "W", "I", "B", "C4", "UP", "ARG", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A pytest fixture is very often requested for what it does rather than for its value, and
# naming it in the signature is the only way to ask for it.
"tests/**" = ["ARG001", "ARG002"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["ecowitt"]
# The listeners and the spool flusher are async, and coverage's sys.monitoring core
# (COVERAGE_CORE=sysmon, set in bin/test-backend.sh and CI) traces lines after `await`, which
# the legacy C core under-reports. On 3.14 sysmon is the default and supports branch
# coverage, so branches are safe to enable.
branch = true
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
# `exclude_also` augments coverage's default pragma list rather than replacing it, so
# `# pragma: no cover` still works alongside these structural exclusions.
exclude_also = [
    "if TYPE_CHECKING:",
    # A module entrypoint: unreachable by definition once the module is imported.
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
