# Generated by devtools-check.py --fix from devtools.toml's [dependabot] table: edit that
# table rather than this file, which `devtools-check.py` compares with what it generates.
#
# Weekly updates: per ecosystem, one pull request of minor and patch releases and one
# of majors, which waits for a hand migration. A release is taken once it is three days
# old, so a hijacked version has usually been pulled before an update proposes it; the
# packages released from the same hands are taken at once.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-majors:
        patterns:
          - "*"
        update-types:
          - "major"

  # The dashboard's page.
  - package-ecosystem: "npm"
    directory: "/dashboard/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      exclude:
        - "@jmerhar/*"
    groups:
      web:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      web-majors:
        patterns:
          - "*"
        update-types:
          - "major"

  # Each project's declared ranges; only a release outside one opens a pull request. jigkit
  # moves in core and the collector together, in one grouped pull request.
  - package-ecosystem: "pip"
    directories:
      - "/core"
      - "/collector"
      - "/dashboard/api"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      exclude:
        - "jigkit"
    groups:
      python:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      python-majors:
        patterns:
          - "*"
        update-types:
          - "major"
