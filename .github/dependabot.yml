# Weekly updates, one grouped pull request per ecosystem, which gh-maintenance merges once its
# checks pass. A pull request builds both images, so a dependency that breaks one fails there.
# A release is taken once it is three days old, so a hijacked version has usually been pulled
# before an update proposes it.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # The dashboard's page.
  - package-ecosystem: "npm"
    directory: "/dashboard/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    # svelte-check names the TypeScript majors it supports as a peer dependency, so a new major
    # cannot install until svelte-check accepts it; move both by hand then.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns:
          - "*"

  # Each project's declared ranges; only a release outside one opens a pull request.
  - package-ecosystem: "pip"
    directories:
      - "/core"
      - "/collector"
      - "/dashboard/api"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      python:
        patterns:
          - "*"
