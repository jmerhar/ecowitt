# Generated by devtools-check.py --fix from devtools.toml's [dependabot] table: edit that
# table rather than this file, which `devtools-check.py` compares with what it generates.
#
# Weekly updates, one grouped pull request per ecosystem. A release is taken once it is
# three days old, so a hijacked version has usually been pulled before an update proposes
# it; the packages released from the same hands are taken at once.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"

  # The dashboard's page. svelte-check names the TypeScript majors it supports as a peer
  # dependency, so a new major cannot install until svelte-check accepts it; move both by hand then.
  - package-ecosystem: "npm"
    directory: "/dashboard/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      exclude:
        - "@jmerhar/*"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns:
          - "*"

  # Each project's declared ranges; only a release outside one opens a pull request. jigkit
  # moves in core and the collector together, in one grouped pull request.
  - package-ecosystem: "pip"
    directories:
      - "/core"
      - "/collector"
      - "/dashboard/api"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      exclude:
        - "jigkit"
    groups:
      python:
        patterns:
          - "*"
