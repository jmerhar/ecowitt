name: Test and Publish

on:
  # push is limited to main because pull_request already covers branch work; triggering on
  # both would run the whole suite twice for every pull request.
  # A release tag (v1.2.3) publishes that version's images and its GitHub release.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Read-only unless a job asks for more, so a compromised step in a test or lint job cannot
# push to the repository or the registry.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    # One job per Python project, each measuring only its own package: `project` is its
    # directory, `package` the part of the ecowitt namespace it ships, and `suite` its name in
    # coverage.toml.
    strategy:
      matrix:
        include:
          - { project: core, package: core, suite: core }
          - { project: collector, package: collector, suite: collector }
          - { project: dashboard/api, package: dashboard, suite: dashboard }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: pip install -e "core[test]" -e "collector[test]" -e "dashboard/api[test]"

      - name: Run tests with coverage
        env:
          # See bin/test-python.sh: the legacy coverage core under-reports lines after
          # `await`, and this package is async throughout.
          COVERAGE_CORE: sysmon
          PYTHON: python
        run: >-
          bin/test-python.sh ${{ matrix.project }} -v --cov=ecowitt.${{ matrix.package }}
          --junitxml=junit/${{ matrix.suite }}.xml
          --cov-report=term-missing --cov-report=xml --cov-report=json --cov-report=html

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.suite }}
          path: |
            ${{ matrix.project }}/coverage.xml
            ${{ matrix.project }}/coverage.json
            ${{ matrix.project }}/htmlcov
            ${{ matrix.project }}/junit
          if-no-files-found: error

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Page script tests with coverage
        run: bin/test-js.sh

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-pages
          path: collector/coverage-js
          if-no-files-found: error

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: dashboard/web

      - name: Type-check and test with coverage
        run: bin/test-web.sh

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: dashboard/web/coverage
          if-no-files-found: error

  # The pages' legacy build, loaded in Chromium 59 with the API over the tests' example station.
  test-legacy-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install
        run: |
          pip install -e core -e "dashboard/api[test]"
          npm ci --no-audit --no-fund --prefix dashboard/web

      - name: Load the pages in Chromium 59
        env:
          PYTHON: python
        run: bin/test-legacy-browser.sh

  # The Bruno collection's dashboard requests, with their assertions, against the API over the
  # tests' example station.
  test-bruno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install
        run: pip install -e core -e "dashboard/api[test]"

      - name: Run the collection
        env:
          PYTHON: python
        run: bin/test-bruno.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Shell scripts
        run: shellcheck bin/*.sh

      - name: Lockfile resolves only to the public registry
        run: bin/check-lockfile.sh

      # Every manifest names one version; a release tag must name it, with its changelog notes.
      - name: Versions agree
        run: bin/version.py check ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Install ruff
        run: pip install ruff

      - name: Ruff
        run: bin/ci-ruff.sh

      # The runner has Docker, so `config` resolves and validates each combination run.
      - name: Compose files parse
        run: bin/check-compose.sh

  coverage:
    needs: [test, test-js, test-web]
    runs-on: ubuntu-latest
    # contents: read for checkout; statuses: write to link the coverage report from the commit.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Restore each report to the path coverage.toml declares (<project>/coverage.json).
      - name: Download core coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-core
          path: core

      - name: Download collector coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-collector
          path: collector

      - name: Download dashboard coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-dashboard
          path: dashboard/api

      - name: Download dashboard pages coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-web
          path: dashboard/web/coverage

      - name: Download page script coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-pages
          path: collector/coverage-js

      # At-a-glance coverage on the run's summary page. The suite, its label and its gate are
      # declared in coverage.toml; the tooling is shared by every project publishing to the
      # coverage site.
      - uses: jmerhar/coverage/.github/actions/summary@v1

      # Codecov is informational (see codecov.yml) -- the gate below is the actual check -- so
      # this never fails the build, and runs before the gate so the data lands even when the
      # gate fails.
      - uses: jmerhar/coverage/.github/actions/codecov@v1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          junit: "*/junit/*.xml,dashboard/api/junit/*.xml"

      # Fails the build if line coverage drops below the bound in coverage.toml. images needs
      # this job, so a regression blocks the image.
      - uses: jmerhar/coverage/.github/actions/gate@v1

      # Only on green pushes to main; the action skips when the token is absent, so this stays
      # green if the secret is ever missing.
      - uses: jmerhar/coverage/.github/actions/publish@v1
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          token: ${{ secrets.COVERAGE_PAGES_TOKEN }}
          description: HTML coverage report

  images:
    # Only after everything is green: the image a deployment pulls is never built from code
    # whose tests did not pass. A pull request builds both images without pushing them, since
    # nothing else builds the dashboard's page or installs either image's dependencies.
    needs: [coverage, lint, test-legacy-browser, test-bruno]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # One image per app: the collector keeps the repository's name, the dashboard adds a suffix.
    strategy:
      matrix:
        include:
          - { image: "", dockerfile: collector/Dockerfile }
          - { image: "-dashboard", dockerfile: dashboard/Dockerfile }
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}${{ matrix.image }}
          # edge for deployments that follow the branch, an immutable tag so a specific build
          # can always be pinned or rolled back to, and on a release tag its version, minor and
          # major line -- plus latest, which the action adds to a semver tag that is not a
          # prerelease and to no other.
          tags: |
            type=edge
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

  release:
    # The GitHub release for a version, once its images are published.
    needs: [images]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create the GitHub release from the changelog
        run: bin/github-release.sh "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
