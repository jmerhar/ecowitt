# Codecov configuration. Informational only -- the gate that fails a build runs in CI with
# its threshold in coverage.toml.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment: false

flags:
  backend:
    paths:
      - backend/
    carryforward: true
  pages:
    paths:
      - backend/src/ecowitt/static/
    carryforward: true
