# Codecov configuration. Informational only -- the gate that fails a build runs in CI with
# its threshold in coverage.toml.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment: false

flags:
  core:
    paths:
      - core/
    carryforward: true
  collector:
    paths:
      - collector/
    carryforward: true
  dashboard:
    paths:
      - dashboard/api/
    carryforward: true
  web:
    paths:
      - dashboard/web/src/
    carryforward: true
  pages:
    paths:
      - collector/src/ecowitt/collector/admin/static/
    carryforward: true
