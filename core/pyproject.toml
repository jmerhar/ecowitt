[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecowitt-core"
version = "0.1.0"
description = "Code shared by Ecowitt Server's collector and dashboard: units, formulas, stores"
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.13",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/jmerhar/ecowitt"

[tool.hatch.build.targets.wheel]
# ecowitt is a namespace shared with ecowitt-collector and ecowitt-dashboard: this project ships
# only ecowitt/core, and no project may add an ecowitt/__init__.py.
packages = ["src/ecowitt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
# Each project's tests run on their own; importlib mode keeps same-named test modules in
# different projects from colliding.
addopts = ["--import-mode=importlib"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["ecowitt.core"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
