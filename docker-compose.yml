# The stack: the server, and an optional public dashboard.
#
# Self-contained on purpose: this file is all anyone needs to run the server, so it pulls the
# published image rather than naming a build context. Building from source is
# docker-compose.build.yml, which `make up` adds.
#
# Everything mutable lives in ./data, including the station configuration, and the dashboard's
# settings in ./data-dashboard. Back those up and there is nothing else to keep.
services:
  ecowitt:
    image: ghcr.io/jmerhar/ecowitt:latest
    container_name: ecowitt
    restart: unless-stopped
    # Runs as an ordinary user so the files under ./data belong to a real account on the host.
    # Change it to match the owner of that directory.
    user: "${ECOWITT_UID:-1000}:${ECOWITT_GID:-1000}"
    mem_limit: 512m
    # Nothing in the image is written at run time: the application writes only to /data, and
    # Python writes no bytecode (PYTHONDONTWRITEBYTECODE). It needs no Linux capabilities.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The database connection, the stations and everything about them are set on the setup
      # page and kept in ./data/config.yaml; see the README.
      # Optional: a push monitor's URL (Uptime Kuma, healthchecks.io), called after readings
      # are written, so the monitor alerts when they stop.
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
      HEARTBEAT_URL_FILE: ${HEARTBEAT_URL_FILE:-}
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-60}
      # The console's Path field; both slash spellings are served.
      INGEST_PATH: ${INGEST_PATH:-/data/report/}
      INGEST_RATE: ${INGEST_RATE:-2}
      INGEST_BURST: ${INGEST_BURST:-20}
      SPOOL_MAX_BYTES: ${SPOOL_MAX_BYTES:-104857600}
      # The container listens on the same port numbers it publishes. Firewalls that see Docker
      # traffic, ufw-docker among them, match the port after address translation -- the
      # container's -- so a mismatch would leave a rule for one port and a listener on another.
      INGEST_PORT: ${ECOWITT_INGEST_PORT:-2551}
      ADMIN_PORT: ${ECOWITT_ADMIN_PORT:-2552}
      # Host names the admin listener answers to; add the one a reverse proxy serves it under.
      ADMIN_HOSTS: ${ADMIN_HOSTS:-localhost,127.0.0.1,::1}
    ports:
      # The ingest listener, which the weather station posts to. Published on every interface
      # because the station is a device on your network (or beyond it) rather than on this
      # host. Narrow it to one address -- "192.0.2.10" -- if this machine has several.
      - "${ECOWITT_INGEST_BIND:-0.0.0.0}:${ECOWITT_INGEST_PORT:-2551}:${ECOWITT_INGEST_PORT:-2551}"
      # The admin listener: status and setup pages, and the read API. Published on loopback, and
      # that publish is what keeps it off your network -- the application mounts none of these
      # routes on the ingest listener above, so the two surfaces cannot be confused. Put a
      # reverse proxy in front of it rather than widening the bind, and set a login on the
      # setup page if anyone you do not trust can reach it.
      - "${ECOWITT_ADMIN_BIND:-127.0.0.1}:${ECOWITT_ADMIN_PORT:-2552}:${ECOWITT_ADMIN_PORT:-2552}"
    volumes:
      - ./data:/data

  # The public dashboard: a page and a read-only API over the readings in InfluxDB. Optional,
  # and started only with `docker compose --profile dashboard up -d`. Until data-dashboard/
  # holds dashboard.yaml it serves an unprotected setup page, so finish setup before the port
  # is reachable by anyone else.
  dashboard:
    image: ghcr.io/jmerhar/ecowitt-dashboard:latest
    container_name: ecowitt-dashboard
    profiles: [dashboard]
    restart: unless-stopped
    user: "${ECOWITT_UID:-1000}:${ECOWITT_GID:-1000}"
    mem_limit: 256m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Addresses of the reverse proxy in front of it, whose X-Forwarded-For is believed.
      FORWARDED_ALLOW_IPS: ${DASHBOARD_FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      # Loopback, for a reverse proxy to publish; the dashboard is meant to be public, the
      # setup page it shows first is not.
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-2553}:2553"
    volumes:
      - ./data-dashboard:/data
