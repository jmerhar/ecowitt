# The stack, as one service.
#
# Self-contained on purpose: this file is all anyone needs to run the server, so it pulls the
# published image rather than naming a build context. Building from source is
# docker-compose.build.yml, which `make up` adds.
#
# Everything mutable lives in ./data: the configuration the setup wizard writes and the spool
# that holds writes while InfluxDB is unreachable. Back that directory up and there is nothing
# else to keep.
services:
  ecowitt:
    image: ghcr.io/jmerhar/ecowitt:latest
    container_name: ecowitt
    restart: unless-stopped
    # Runs as an ordinary user so the files under ./data belong to a real account on the host.
    # Change it to match the owner of that directory.
    user: "${ECOWITT_UID:-1000}:${ECOWITT_GID:-1000}"
    mem_limit: 512m
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Where to store readings. The rest of the configuration -- units, channel names, the
      # PASSKEY allowlist, the site location -- is set in the browser on first run and kept in
      # ./data/config.yaml.
      INFLUX_URL: ${INFLUX_URL:-}
      INFLUX_DATABASE: ${INFLUX_DATABASE:-weather}
      INFLUX_TOKEN: ${INFLUX_TOKEN:-}
      INFLUX_TOKEN_FILE: ${INFLUX_TOKEN_FILE:-}
      # The container listens on the same port numbers it publishes. Firewalls that see Docker
      # traffic, ufw-docker among them, match the port after address translation -- the
      # container's -- so a mismatch would leave a rule for one port and a listener on another.
      INGEST_PORT: ${ECOWITT_INGEST_PORT:-2551}
      ADMIN_PORT: ${ECOWITT_ADMIN_PORT:-2552}
    ports:
      # The ingest listener, which the weather station posts to. Published on every interface
      # because the station is a device on your network (or beyond it) rather than on this
      # host. Narrow it to one address -- "192.0.2.10" -- if this machine has several.
      - "${ECOWITT_INGEST_BIND:-0.0.0.0}:${ECOWITT_INGEST_PORT:-2551}:${ECOWITT_INGEST_PORT:-2551}"
      # The admin listener: status page and read API. Published on loopback, and that publish
      # is what keeps it off your network -- the application mounts none of these routes on
      # the ingest listener above, so the two surfaces cannot be confused. It has no login of
      # its own: put a reverse proxy in front of it rather than widening the bind.
      - "${ECOWITT_ADMIN_BIND:-127.0.0.1}:${ECOWITT_ADMIN_PORT:-2552}:${ECOWITT_ADMIN_PORT:-2552}"
    volumes:
      - ./data:/data
