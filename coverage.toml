# Coverage configuration for the shared tooling in jmerhar/coverage, which renders the CI
# summary table, enforces the gate, and publishes the HTML report.
#
# One suite per Python project, and one for the scripts the collector's admin pages load. A Python
# project's JSON summary is read
# rather than the XML coverage.py can also emit, because the JSON totals are exact. The page
# scripts are measured by Node's built-in coverage, whose lcov bin/lcov-to-istanbul.py turns into
# the istanbul summary and report read here; Codecov takes the lcov beside them.

# The gate sits just under the measured line coverage: tight enough to catch a real
# regression, loose enough to tolerate the odd defensive line. Raise it as coverage climbs;
# never lower it to make a red build pass -- and never delete a guard to flatter the number
# either, since an unreachable branch is better described by a pragma than removed.

[suites.core]
label = "Core (Python)"
format = "coveragepy"
report = "core/coverage.json"
html = "core/htmlcov"
gate = 98.0

[suites.collector]
label = "Collector (Python)"
format = "coveragepy"
report = "collector/coverage.json"
html = "collector/htmlcov"
gate = 98.0

[suites.dashboard]
label = "Dashboard API (Python)"
format = "coveragepy"
report = "dashboard/api/coverage.json"
html = "dashboard/api/htmlcov"
gate = 98.0

[suites.pages]
label = "Collector page scripts (JavaScript)"
format = "istanbul"
report = "collector/coverage-js/coverage-summary.json"
html = "collector/coverage-js/html"
gate = 98.0
