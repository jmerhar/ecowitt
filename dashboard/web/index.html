<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Added to a home screen, the page opens as an app: the manifest for Android, and the
         apple- tags for iOS and iPadOS, which take their icon and title from these. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Weather" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16181a" />
    <title>Weather</title>
    <!-- A page that fails to start says why, rather than staying blank: on a browser too old for
         it there may be no console to look in. Once the page has drawn, errors are left alone.
         Written for any browser, so in the oldest JavaScript. -->
    <script>
      (function () {
        function show(text) {
          var app = document.getElementById("app");
          if (!app || app.firstChild) return;
          var box = document.createElement("pre");
          box.className = "page-error";
          box.textContent = "The page could not start: " + text;
          app.appendChild(box);
        }
        window.addEventListener("error", function (e) {
          show(e.message + (e.filename ? " (" + e.filename + ":" + e.lineno + ")" : ""));
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          show(String((r && (r.stack || r.message)) || r));
        });
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
