<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The favicon's sun and cloud on an opaque square: home screens fill a transparent icon with
       a colour of their own. The drawing stays within the central 60%, inside the circle Android
       keeps when it crops an icon to its own shape. -->
  <rect width="512" height="512" fill="#16181a"/>
  <g transform="translate(25.8 41.6) scale(13.4)">
    <circle cx="13" cy="13" r="6" fill="#e3b04b"/>
    <path d="M9 25h15a5 5 0 0 0 0-10 7 7 0 0 0-13 1 4.5 4.5 0 0 0-2 9z" fill="#7cc4ad"/>
  </g>
</svg>
